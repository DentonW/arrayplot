<svg version="1.1" baseProfile="full" width="100%" height="100%" viewBox="0 0 535 512" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E4A62"/>
      <stop offset="100%" stop-color="#1C2D3A"/>
    </linearGradient>

    <!-- Professional Multi-Stage Neon Glow Filter -->
    <filter id="neon_glow" x="-50%" y="-50%" width="200%" height="200%" filterRes="1200 1200">
      <!-- Stage 1: Intense, narrow glow core -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="narrow_blur"/>
      <feComponentTransfer in="narrow_blur" result="bright_narrow_blur">
        <feFuncA type="linear" slope="0.9"/>
      </feComponentTransfer>
      
      <!-- Stage 2: Wide, ambient outer atmosphere dispersion -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="wide_blur"/>
      <feComponentTransfer in="wide_blur" result="soft_wide_blur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      
      <!-- Stage 3: Merge back together -->
      <feMerge>
        <feMergeNode in="soft_wide_blur"/>
        <feMergeNode in="bright_narrow_blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop-Shadow for Grid Tiles (feDropShadow replaced with feGaussianBlur+feOffset+feMerge for Inkscape compatibility) -->
    <filter id="tile_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="shadow_blur"/>
      <feOffset in="shadow_blur" dx="0" dy="6" result="shadow_offset"/>
      <feComponentTransfer in="shadow_offset" result="shadow_final">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow_final"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Squircle Frame (Widened to 495 to comfortably house the 415px wide grid) -->
  <rect x="20" y="20" width="495" height="472" rx="80" ry="80" fill="url(#bg_grad)" stroke="#4A6A82" stroke-width="2"/>
  <rect x="35" y="35" width="465" height="442" rx="65" ry="65" fill="#1C2D3A"/>

  <!-- Matrix Grid (Representing the 2D Array) -->
  <g id="grid" filter="url(#tile_shadow)">
    <!-- Row 1 -->
    <rect x="60" y="60" width="75" height="75" rx="10" ry="10" fill="#4DB6AC" opacity="0.85"/>
    <rect x="145" y="60" width="75" height="75" rx="10" ry="10" fill="#57C1A7" opacity="0.85"/>
    <rect x="230" y="60" width="75" height="75" rx="10" ry="10" fill="#81C784" opacity="0.85"/>
    <rect x="315" y="60" width="75" height="75" rx="10" ry="10" fill="#A5D6A7" opacity="0.85"/>
    <rect x="400" y="60" width="75" height="75" rx="10" ry="10" fill="#FFB74D" opacity="0.85"/>

    <!-- Row 2 -->
    <rect x="60" y="145" width="75" height="75" rx="10" ry="10" fill="#4DB6AC" opacity="0.85"/>
    <rect x="145" y="145" width="75" height="75" rx="10" ry="10" fill="#81C784" opacity="0.85"/>
    <rect x="230" y="145" width="75" height="75" rx="10" ry="10" fill="#A5D6A7" opacity="0.85"/>
    <rect x="315" y="145" width="75" height="75" rx="10" ry="10" fill="#FFB74D" opacity="0.85"/>
    <rect x="400" y="145" width="75" height="75" rx="10" ry="10" fill="#FFB74D" opacity="0.85"/>

    <!-- Row 3 -->
    <rect x="60" y="230" width="75" height="75" rx="10" ry="10" fill="#4DB6AC" opacity="0.85"/>
    <rect x="145" y="230" width="75" height="75" rx="10" ry="10" fill="#57C1A7" opacity="0.85"/>
    <rect x="230" y="230" width="75" height="75" rx="10" ry="10" fill="#A5D6A7" opacity="0.85"/>
    <rect x="315" y="230" width="75" height="75" rx="10" ry="10" fill="#FFD54F" opacity="0.85"/>
    <rect x="400" y="230" width="75" height="75" rx="10" ry="10" fill="#FFA726" opacity="0.85"/>

    <!-- Row 4 -->
    <rect x="60" y="315" width="75" height="75" rx="10" ry="10" fill="#4DB6AC" opacity="0.85"/>
    <rect x="145" y="315" width="75" height="75" rx="10" ry="10" fill="#81C784" opacity="0.85"/>
    <rect x="230" y="315" width="75" height="75" rx="10" ry="10" fill="#FFD54F" opacity="0.85"/>
    <rect x="315" y="315" width="75" height="75" rx="10" ry="10" fill="#FFB74D" opacity="0.85"/>
    <rect x="400" y="315" width="75" height="75" rx="10" ry="10" fill="#FFA726" opacity="0.85"/>
  </g>

  <!-- Line Plot Overlay with Glow -->
  <g id="chart" filter="url(#neon_glow)">
    <polyline points="80,320 160,250 240,280 320,190 400,120 435,85" stroke="#FFFFFF" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data Nodes -->
    <circle cx="80" cy="320" r="7.5" fill="#FFFFFF"/>
    <circle cx="160" cy="250" r="7.5" fill="#FFFFFF"/>
    <circle cx="240" cy="280" r="7.5" fill="#FFFFFF"/>
    <circle cx="320" cy="190" r="7.5" fill="#FFFFFF"/>
    <circle cx="400" cy="120" r="7.5" fill="#FFFFFF"/>

    <!-- Solid Arrow Head -->
    <polygon points="418,82 450,70 441,100" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Text and Signature Branding (Shifted rightward to balance with new width) -->
  <text x="150" y="440" font-family="Helvetica, Arial, sans-serif" font-size="60px" font-weight="normal" fill="#FFFFFF" filter="url(#neon_glow)">arrayplot</text>
</svg>
